            <?php foreach ($schedules as $schedule): ?>

                <td>

        <form action="waste_management.php" method="POST">

            <label>Area:</label>

            <label>Schedule:</label>

            <label>Status:</label>
            <select name="status">
                <option value="Scheduled" <?php echo $edit_schedule["Status"]=="Scheduled" ? "selected" : "" ; ?>

                <option value="Completed" <?php echo $edit_schedule["Status"]=="Completed" ? "selected" : "" ; ?>
                    >Completed</option>
            </select>
            <!-- Submit button to update schedule -->
            <button type="submit">Update</button>
        </form>
        <?php endif; ?> <!-- End Admin check for edit form -->
